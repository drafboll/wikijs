<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8430ce"></path></marker></defs>
  <rect width="1000" height="470" fill="#ffffff"></rect>
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Cloud Pod Architecture : plusieurs sites, une seule porte d'entrée</text>
  <g font-size="12" text-anchor="middle">
    <rect x="400" y="55" width="200" height="55" rx="10" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect><text x="500" y="80" font-weight="700" fill="#b06000">vdi.entreprise.fr</text><text x="500" y="98" fill="#3c4043">GSLB (répartition globale DNS)</text>
    <line x1="440" y1="110" x2="250" y2="148" stroke="#5f6368" stroke-width="2"></line>
    <line x1="560" y1="110" x2="750" y2="148" stroke="#5f6368" stroke-width="2"></line>
    
    <rect x="30" y="150" width="420" height="210" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"></rect>
    <text x="240" y="176" font-weight="700" font-size="15" fill="#174ea6">Site « Paris » · Pod A</text>
    <rect x="50" y="190" width="110" height="55" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect><text x="105" y="222" fill="#5b1e8a" font-weight="700">CS A1</text>
    <rect x="170" y="190" width="110" height="55" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect><text x="225" y="222" fill="#5b1e8a" font-weight="700">CS A2</text>
    <rect x="290" y="190" width="140" height="55" rx="8" fill="#fff" stroke="#1a73e8"></rect><text x="360" y="213" fill="#174ea6" font-weight="700">pool-w11-paris</text><text x="360" y="230" fill="#3c4043">300 bureaux</text>
    <text x="240" y="275" fill="#3c4043">base locale AD LDS (config du pod)</text>
    <rect x="50" y="290" width="380" height="50" rx="8" fill="#fff" stroke="#8430ce" stroke-dasharray="5 4"></rect><text x="240" y="312" fill="#5b1e8a" font-weight="700">LDAP global (réplique)</text><text x="240" y="328" fill="#3c4043">droits globaux · sessions de tous les pods</text>
    
    <rect x="550" y="150" width="420" height="210" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
    <text x="760" y="176" font-weight="700" font-size="15" fill="#0d652d">Site « Lyon » · Pod B</text>
    <rect x="570" y="190" width="110" height="55" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect><text x="625" y="222" fill="#5b1e8a" font-weight="700">CS B1</text>
    <rect x="690" y="190" width="110" height="55" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect><text x="745" y="222" fill="#5b1e8a" font-weight="700">CS B2</text>
    <rect x="810" y="190" width="140" height="55" rx="8" fill="#fff" stroke="#188038"></rect><text x="880" y="213" fill="#0d652d" font-weight="700">pool-w11-lyon</text><text x="880" y="230" fill="#3c4043">300 bureaux</text>
    <text x="760" y="275" fill="#3c4043">base locale AD LDS (config du pod)</text>
    <rect x="570" y="290" width="380" height="50" rx="8" fill="#fff" stroke="#8430ce" stroke-dasharray="5 4"></rect><text x="760" y="312" fill="#5b1e8a" font-weight="700">LDAP global (réplique)</text><text x="760" y="328" fill="#3c4043">droits globaux · sessions de tous les pods</text>
    
    <line x1="430" y1="315" x2="568" y2="315" stroke="#8430ce" stroke-width="3" marker-end="url(#a)"></line>
    <line x1="568" y1="330" x2="432" y2="330" stroke="#8430ce" stroke-width="3" marker-end="url(#a)"></line>
    <text x="500" y="355" fill="#5b1e8a" font-size="11">VIPA 8472 · LDAP 22389</text>
  </g>
  <rect x="30" y="380" width="940" height="78" rx="10" fill="#f3e8fd" stroke="#8430ce"></rect>
  <g font-size="13" fill="#3c4043">
    <text x="50" y="405"><tspan font-weight="700" fill="#5b1e8a">Global entitlement « Bureau Windows 11 »</tspan> = pool-w11-paris + pool-w11-lyon, pour GRP-VDI-USERS.</text>
    <text x="50" y="427">L'utilisateur voit UNE icône. Horizon le place de préférence sur son site (home site, ou site le plus proche),</text>
    <text x="50" y="447">et si Paris est en panne, il obtient un bureau à Lyon. Il retrouve sa session existante quel que soit le site où il se connecte.</text>
  </g>
</svg>
