<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"></path></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"></path></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#188038"></path></marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"></rect>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">vMotion, DRS et HA : les super-pouvoirs d'un cluster</text>
  <g font-size="13" text-anchor="middle">
    
    <text x="160" y="70" font-size="17" font-weight="700" fill="#1a73e8">① vMotion</text>
    <text x="160" y="90" fill="#5f6368" font-size="12">déplacer une VM allumée d'un hôte à l'autre</text>
    <rect x="30" y="105" width="110" height="150" rx="8" fill="#e8eaed" stroke="#5f6368"></rect><text x="85" y="125" font-weight="700" fill="#3c4043">esx01</text>
    <rect x="45" y="140" width="80" height="34" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-dasharray="4 3"></rect><text x="85" y="162" fill="#174ea6" font-size="12">VM A</text>
    <rect x="180" y="105" width="110" height="150" rx="8" fill="#e8eaed" stroke="#5f6368"></rect><text x="235" y="125" font-weight="700" fill="#3c4043">esx02</text>
    <rect x="195" y="140" width="80" height="34" rx="5" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="235" y="162" fill="#174ea6" font-size="12">VM A</text>
    <path d="M125 157 L193 157" stroke="#1a73e8" stroke-width="3" marker-end="url(#b)"></path>
    <text x="160" y="205" fill="#3c4043" font-size="11">la RAM est copiée</text>
    <text x="160" y="220" fill="#3c4043" font-size="11">à chaud, coupure</text>
    <text x="160" y="235" fill="#3c4043" font-size="11">&lt; 1 seconde</text>
    <text x="160" y="285" fill="#3c4043" font-size="12">Usage : maintenance d'un hôte</text>
    <text x="160" y="303" fill="#3c4043" font-size="12">sans arrêter les utilisateurs</text>
    
    <text x="490" y="70" font-size="17" font-weight="700" fill="#188038">② DRS</text>
    <text x="490" y="90" fill="#5f6368" font-size="12">équilibrage automatique de la charge</text>
    <rect x="360" y="105" width="110" height="150" rx="8" fill="#e8eaed" stroke="#5f6368"></rect><text x="415" y="125" font-weight="700" fill="#3c4043">esx01 : 95 %</text>
    <rect x="375" y="138" width="80" height="24" rx="4" fill="#e8f0fe" stroke="#1a73e8"></rect>
    <rect x="375" y="166" width="80" height="24" rx="4" fill="#e8f0fe" stroke="#1a73e8"></rect>
    <rect x="375" y="194" width="80" height="24" rx="4" fill="#fce8e6" stroke="#d93025"></rect><text x="415" y="211" fill="#a50e0e" font-size="11">VM lourde</text>
    <rect x="510" y="105" width="110" height="150" rx="8" fill="#e8eaed" stroke="#5f6368"></rect><text x="565" y="125" font-weight="700" fill="#3c4043">esx02 : 20 %</text>
    <rect x="525" y="138" width="80" height="24" rx="4" fill="#e8f0fe" stroke="#1a73e8"></rect>
    <rect x="525" y="194" width="80" height="24" rx="4" fill="#fce8e6" stroke="#d93025" stroke-dasharray="4 3"></rect>
    <path d="M457 206 L523 206" stroke="#188038" stroke-width="3" marker-end="url(#g)"></path>
    <text x="490" y="285" fill="#3c4043" font-size="12">DRS surveille et utilise vMotion</text>
    <text x="490" y="303" fill="#3c4043" font-size="12">pour répartir les VM</text>
    
    <text x="820" y="70" font-size="17" font-weight="700" fill="#d93025">③ HA</text>
    <text x="820" y="90" fill="#5f6368" font-size="12">redémarrage auto si un hôte tombe</text>
    <rect x="690" y="105" width="110" height="150" rx="8" fill="#fce8e6" stroke="#d93025" stroke-width="2"></rect><text x="745" y="125" font-weight="700" fill="#a50e0e">esx01 💥</text>
    <line x1="700" y1="140" x2="790" y2="240" stroke="#d93025" stroke-width="3"></line><line x1="790" y1="140" x2="700" y2="240" stroke="#d93025" stroke-width="3"></line>
    <rect x="840" y="105" width="110" height="150" rx="8" fill="#e8eaed" stroke="#5f6368"></rect><text x="895" y="125" font-weight="700" fill="#3c4043">esx02</text>
    <rect x="855" y="140" width="80" height="30" rx="5" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="895" y="160" fill="#174ea6" font-size="11">VM B (reboot)</text>
    <path d="M802 155 L853 155" stroke="#d93025" stroke-width="3" marker-end="url(#r)"></path>
    <text x="820" y="285" fill="#3c4043" font-size="12">Les VM redémarrent (≈ 1 à 3 min)</text>
    <text x="820" y="303" fill="#3c4043" font-size="12">sur un hôte survivant</text>
  </g>
  
  <rect x="30" y="330" width="920" height="210" rx="10" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect>
  <text x="50" y="360" font-size="16" font-weight="700" fill="#b06000">Ce qu'il faut pour en profiter (et pourquoi ton lab les a désactivés)</text>
  <g font-size="13" fill="#3c4043">
    <text x="50" y="390">• Au moins 2 hôtes ESXi dans le même cluster (ton lab n'en a qu'un : esx01).</text>
    <text x="50" y="414">• Un stockage partagé vu par tous les hôtes (SAN iSCSI/FC, NAS NFS ou vSAN), ou vMotion « stockage » plus lent.</text>
    <text x="50" y="438">• Un réseau vMotion dédié (une interface vmk avec le service vMotion activé).</text>
    <text x="50" y="462">• Des licences vSphere qui incluent ces fonctions.</text>
    <text x="50" y="494" font-weight="700" fill="#b06000">En VDI de production :</text>
    <text x="210" y="494">HA protège les serveurs Horizon, DRS répartit les centaines de bureaux sur les hôtes,</text>
    <text x="50" y="516">vMotion permet de patcher les ESXi en journée. Tu les verras activés dans l'infra de ton entreprise.</text>
  </g>
</svg>
