<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="520" fill="#ffffff"></rect>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Dédié ou flottant · persistant ou non persistant</text>
  <g font-size="13" text-anchor="middle">
    
    <rect x="30" y="60" width="450" height="300" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"></rect>
    <text x="255" y="88" font-size="17" font-weight="700" fill="#174ea6">Pool DÉDIÉ (dedicated)</text>
    <text x="255" y="108" font-size="12" fill="#174ea6">« ta place réservée au bureau »</text>
    <g font-size="12">
      <text x="90" y="145">👤 Alice</text><line x1="120" y1="150" x2="190" y2="150" stroke="#1a73e8" stroke-width="2"></line><rect x="195" y="130" width="100" height="36" rx="5" fill="#fff" stroke="#1a73e8"></rect><text x="245" y="153">vdi-01</text>
      <text x="90" y="195">👤 Bob</text><line x1="120" y1="200" x2="190" y2="200" stroke="#1a73e8" stroke-width="2"></line><rect x="195" y="180" width="100" height="36" rx="5" fill="#fff" stroke="#1a73e8"></rect><text x="245" y="203">vdi-02</text>
      <text x="90" y="245">👤 Chloé</text><line x1="120" y1="250" x2="190" y2="250" stroke="#1a73e8" stroke-width="2"></line><rect x="195" y="230" width="100" height="36" rx="5" fill="#fff" stroke="#1a73e8"></rect><text x="245" y="253">vdi-03</text>
    </g>
    <g text-anchor="start" font-size="12" fill="#3c4043">
      <text x="315" y="145">À la 1re connexion,</text>
      <text x="315" y="161">l'utilisateur reçoit</text>
      <text x="315" y="177">une VM qui devient</text>
      <text x="315" y="193">la SIENNE (assignment).</text>
      <text x="315" y="225">Il retrouve toujours</text>
      <text x="315" y="241">la même machine.</text>
      <text x="50" y="295">✓ Rassurant pour l'utilisateur, applis installées par lui</text>
      <text x="50" y="315">✗ 1 VM par utilisateur, même s'il est en congés</text>
      <text x="50" y="335">✗ Chaque VM dérive dans le temps (à maintenir)</text>
    </g>
    
    <rect x="500" y="60" width="450" height="300" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
    <text x="725" y="88" font-size="17" font-weight="700" fill="#0d652d">Pool FLOTTANT (floating)</text>
    <text x="725" y="108" font-size="12" fill="#0d652d">« le flex office : tu prends un bureau libre »</text>
    <g font-size="12">
      <text x="550" y="165">👤 Alice</text><text x="550" y="205">👤 Bob</text><text x="550" y="245">👤 Chloé</text>
      <line x1="590" y1="160" x2="680" y2="190" stroke="#188038" stroke-width="2"></line>
      <line x1="590" y1="200" x2="680" y2="150" stroke="#188038" stroke-width="2"></line>
      <line x1="590" y1="240" x2="680" y2="235" stroke="#188038" stroke-width="2"></line>
      <rect x="685" y="130" width="100" height="34" rx="5" fill="#fff" stroke="#188038"></rect><text x="735" y="152">vdi-01</text>
      <rect x="685" y="172" width="100" height="34" rx="5" fill="#fff" stroke="#188038"></rect><text x="735" y="194">vdi-02</text>
      <rect x="685" y="214" width="100" height="34" rx="5" fill="#fff" stroke="#188038"></rect><text x="735" y="236">vdi-03</text>
    </g>
    <g text-anchor="start" font-size="12" fill="#3c4043">
      <text x="800" y="145">N'importe quelle</text>
      <text x="800" y="161">VM disponible.</text>
      <text x="800" y="193">À la déconnexion,</text>
      <text x="800" y="209">la VM est détruite</text>
      <text x="800" y="225">et recréée propre.</text>
      <text x="520" y="295">✓ Autant de VM que d'utilisateurs connectés en même temps</text>
      <text x="520" y="315">✓ Toujours propre, patché d'un coup (golden image)</text>
      <text x="520" y="335">✗ Le profil et les données doivent être stockés ailleurs</text>
    </g>
  </g>
  <rect x="30" y="380" width="920" height="125" rx="12" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect>
  <text x="490" y="407" text-anchor="middle" font-size="15" font-weight="700" fill="#b06000">Persistant vs non persistant : ce qui survit à la déconnexion</text>
  <g font-size="12" fill="#3c4043">
    <text x="50" y="435"><tspan font-weight="700">Persistant</tspan> (généralement dédié + Full Clone) : la VM garde tout. Windows, applis installées, fichiers, profil.</text>
    <text x="50" y="458"><tspan font-weight="700">Non persistant</tspan> (flottant + Instant Clone) : la VM repart de la golden image à chaque session.</text>
    <text x="50" y="481">Pour que l'utilisateur garde ses réglages, on externalise : <tspan font-weight="700">profil</tspan> (FSLogix, DEM), <tspan font-weight="700">fichiers</tspan> (redirection de dossiers, OneDrive),</text>
    <text x="50" y="499"><tspan font-weight="700">applications</tspan> (App Volumes). C'est le modèle recommandé aujourd'hui, et celui de ton lab.</text>
  </g>
</svg>
