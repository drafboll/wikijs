  </g>
  <text x="500" y="305" text-anchor="middle" font-size="13" fill="#3c4043">Ordre conseillé : 01 ➜ 02 ➜ 03 ➜ 04 ➜ 05 ➜ 06 ➜ 07 (la page 03 peut se lire avant la 02 si tu préfères la théorie d'abord)</text>
  <text x="500" y="330" text-anchor="middle" font-size="12" fill="#5f6368">Chaque page se termine par un quiz · les pages 05 à 07 contiennent des travaux pratiques à faire dans ton lab</text>
