    <rect x="20" y="60" width="300" height="34" rx="17" fill="#e6f4ea" stroke="#188038"></rect><text x="170" y="82" font-weight="700" fill="#0d652d">COMPRENDRE</text>
    <rect x="340" y="60" width="300" height="34" rx="17" fill="#f3e8fd" stroke="#8430ce"></rect><text x="490" y="82" font-weight="700" fill="#5b1e8a">CONSTRUIRE</text>
    <rect x="660" y="60" width="320" height="34" rx="17" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="820" y="82" font-weight="700" fill="#174ea6">MAÎTRISER</text>
    
    <rect x="20" y="110" width="140" height="160" rx="10" fill="#fff" stroke="#188038" stroke-width="2"></rect><text x="90" y="140" font-size="26" font-weight="700" fill="#188038">01</text><text x="90" y="165" font-weight="700" fill="#3c4043">Bases de la</text><text x="90" y="181" font-weight="700" fill="#3c4043">virtualisation</text><text x="90" y="205" fill="#5f6368">ESXi, vCenter,</text><text x="90" y="221" fill="#5f6368">stockage, réseau,</text><text x="90" y="237" fill="#5f6368">snapshots, nested</text>
    <rect x="180" y="110" width="140" height="160" rx="10" fill="#fff" stroke="#188038" stroke-width="2"></rect><text x="250" y="140" font-size="26" font-weight="700" fill="#188038">03</text><text x="250" y="165" font-weight="700" fill="#3c4043">VDI et</text><text x="250" y="181" font-weight="700" fill="#3c4043">Horizon</text><text x="250" y="205" fill="#5f6368">composants, flux</text><text x="250" y="221" fill="#5f6368">de connexion, pools,</text><text x="250" y="237" fill="#5f6368">Instant Clones</text>
    <rect x="340" y="110" width="140" height="160" rx="10" fill="#fff" stroke="#8430ce" stroke-width="2"></rect><text x="410" y="140" font-size="26" font-weight="700" fill="#8430ce">02</text><text x="410" y="165" font-weight="700" fill="#3c4043">Infrastructure</text><text x="410" y="181" font-weight="700" fill="#3c4043">du lab</text><text x="410" y="205" fill="#5f6368">AD, DNS, NTP,</text><text x="410" y="221" fill="#5f6368">DHCP, ESXi,</text><text x="410" y="237" fill="#5f6368">vCenter</text>
    <rect x="500" y="110" width="140" height="160" rx="10" fill="#fff" stroke="#8430ce" stroke-width="2"></rect><text x="570" y="140" font-size="26" font-weight="700" fill="#8430ce">04</text><text x="570" y="165" font-weight="700" fill="#3c4043">Installation</text><text x="570" y="181" font-weight="700" fill="#3c4043">d'Horizon</text><text x="570" y="205" fill="#5f6368">Connection Server,</text><text x="570" y="221" fill="#5f6368">golden image,</text><text x="570" y="237" fill="#5f6368">pool, client</text>
    <rect x="660" y="110" width="100" height="160" rx="10" fill="#fff" stroke="#1a73e8" stroke-width="2"></rect><text x="710" y="140" font-size="26" font-weight="700" fill="#1a73e8">05</text><text x="710" y="165" font-weight="700" fill="#3c4043">Adminis-</text><text x="710" y="181" font-weight="700" fill="#3c4043">tration</text><text x="710" y="205" fill="#5f6368">console, RDS,</text><text x="710" y="221" fill="#5f6368">droits, GPO,</text><text x="710" y="237" fill="#5f6368">helpdesk</text>
