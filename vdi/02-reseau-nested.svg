<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="470" fill="#ffffff"></rect>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Pourquoi le réseau des VM imbriquées a besoin du mode promiscuité</text>
  <g font-size="13" text-anchor="middle">
    <rect x="40" y="60" width="900" height="70" rx="10" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect>
    <text x="490" y="88" font-weight="700" fill="#b06000">VMnet8 (Workstation) : ne connaît qu'UNE adresse MAC sur ce port, celle de la carte de la VM esx01</text>
    <text x="490" y="110" fill="#b06000">00:0c:29:aa:bb:cc</text>
    <line x1="490" y1="130" x2="490" y2="165" stroke="#e37400" stroke-width="4"></line>
    <rect x="40" y="165" width="900" height="270" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
    <text x="70" y="192" text-anchor="start" font-weight="700" fill="#0d652d" font-size="15">esx01 · vSwitch0</text>
    <rect x="330" y="180" width="320" height="40" rx="6" fill="#fff" stroke="#188038"></rect><text x="490" y="205" fill="#0d652d">vmnic0 (MAC 00:0c:29:aa:bb:cc)</text>
    <rect x="80" y="260" width="200" height="80" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect><text x="180" y="290" font-weight="700" fill="#5b1e8a">vcsa01</text><text x="180" y="312" font-size="12" fill="#5b1e8a">MAC 00:50:56:11:...</text>
    <rect x="390" y="260" width="200" height="80" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect><text x="490" y="290" font-weight="700" fill="#5b1e8a">cs01</text><text x="490" y="312" font-size="12" fill="#5b1e8a">MAC 00:50:56:22:...</text>
    <rect x="700" y="260" width="200" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="800" y="290" font-weight="700" fill="#174ea6">vdi-01</text><text x="800" y="312" font-size="12" fill="#174ea6">MAC 00:50:56:33:...</text>
    <line x1="180" y1="260" x2="420" y2="220" stroke="#188038" stroke-width="2"></line>
    <line x1="490" y1="260" x2="490" y2="220" stroke="#188038" stroke-width="2"></line>
    <line x1="800" y1="260" x2="560" y2="220" stroke="#188038" stroke-width="2"></line>
    <text x="490" y="372" fill="#a50e0e" font-weight="700">Problème : les trames des VM sortent avec LEUR MAC (00:50:56:...), pas celle de vmnic0.</text>
    <text x="490" y="394" fill="#a50e0e">Par défaut, le vSwitch rejette ces trames « usurpées » et les réponses ne reviennent pas.</text>
    <text x="490" y="420" fill="#0d652d" font-weight="700">Solution : sur vSwitch0 (et le port group VM Network), Sécurité ➜ Accepter les 3 options.</text>
  </g>
  <g font-size="13" fill="#3c4043">
    <text x="40" y="458" font-family="Consolas, monospace">Mode promiscuité : Accepter · Modifications d'adresse MAC : Accepter · Transmissions forgées : Accepter</text>
  </g>
</svg>
