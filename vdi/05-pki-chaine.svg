<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e37400"></path></marker></defs>
  <rect width="1000" height="500" fill="#ffffff"></rect>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">La PKI du lab : une racine, un modèle par usage</text>

  <rect x="340" y="55" width="320" height="85" rx="12" fill="#fef7e0" stroke="#e37400" stroke-width="3"></rect>
  <text x="500" y="82" text-anchor="middle" font-size="17" font-weight="700" fill="#b06000">🔏 LAB-ROOT-CA</text>
  <text x="500" y="103" text-anchor="middle" font-size="12" fill="#b06000">CA racine d'entreprise sur DC01</text>
  <text x="500" y="121" text-anchor="middle" font-size="12" fill="#b06000">RSA 4096 · SHA-256 · 10 ans · PathLength=0</text>

  <line x1="420" y1="140" x2="175" y2="182" stroke="#e37400" stroke-width="2.5" marker-end="url(#a)"></line>
  <line x1="500" y1="140" x2="500" y2="182" stroke="#e37400" stroke-width="2.5" marker-end="url(#a)"></line>
  <line x1="580" y1="140" x2="825" y2="182" stroke="#e37400" stroke-width="2.5" marker-end="url(#a)"></line>
  <text x="512" y="166" font-size="12" fill="#b06000" font-weight="700">signe</text>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="185" width="290" height="175" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"></rect>
    <text x="175" y="210" font-size="15" font-weight="700" fill="#a50e0e">DC01.lab.lan</text>
    <text x="175" y="230" fill="#3c4043">modèle LAB-DomainController</text>
    <text x="175" y="252" fill="#3c4043">nom tiré de l'AD · clé non exportable</text>
    <text x="175" y="272" fill="#3c4043">inscription automatique (GPO)</text>
    <text x="175" y="292" fill="#3c4043">1 an, renouvelé 6 semaines avant</text>
    <text x="175" y="318" font-weight="700" fill="#a50e0e">➜ active LDAPS (port 636)</text>
    <text x="175" y="340" fill="#5f6368">page 05</text>

    <rect x="355" y="185" width="290" height="175" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
    <text x="500" y="210" font-size="15" font-weight="700" fill="#0d652d">192.168.50.12 (vCenter)</text>
    <text x="500" y="230" fill="#3c4043">modèle LAB-vCenter</text>
    <text x="500" y="252" fill="#3c4043">nom fourni par la CSR du vCenter</text>
    <text x="500" y="272" fill="#3c4043">approbation obligatoire</text>
    <text x="500" y="292" fill="#3c4043">SAN : l'IP en DNS et en IP</text>
    <text x="500" y="318" font-weight="700" fill="#0d652d">➜ plus d'alerte sur le vSphere Client</text>
    <text x="500" y="340" fill="#5f6368">page 07</text>

    <rect x="680" y="185" width="290" height="175" rx="10" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"></rect>
    <text x="825" y="210" font-size="15" font-weight="700" fill="#5b1e8a">horizon.lab.lan</text>
    <text x="825" y="230" fill="#3c4043">modèle LAB-HorizonServer</text>
    <text x="825" y="252" fill="#3c4043">nom tiré de l'AD · HORIZON$ seul</text>
    <text x="825" y="272" fill="#3c4043">clé exportable (exigée par Horizon)</text>
    <text x="825" y="292" fill="#3c4043">nom convivial « vdm »</text>
    <text x="825" y="318" font-weight="700" fill="#5b1e8a">➜ console et client sans alerte</text>
    <text x="825" y="340" fill="#5f6368">pages 08 et 10</text>
  </g>

  <rect x="30" y="380" width="940" height="100" rx="10" fill="#f1f3f4" stroke="#5f6368"></rect>
  <text x="50" y="405" font-size="14" font-weight="700" fill="#3c4043">Ce que la CA refuse de faire</text>
  <g font-size="12" fill="#3c4043">
    <text x="50" y="428">🚫 Aucun modèle par défaut (LoadDefaultTemplates=0)</text>
    <text x="50" y="448">🚫 Pas d'inscription web : pas de relais NTLM (ESC8)</text>
    <text x="50" y="468">🚫 Pas d'EDITF_ATTRIBUTESUBJECTALTNAME2 (ESC6)</text>
    <text x="520" y="428">🚫 Aucun nom choisi par le demandeur sans approbation (ESC1)</text>
    <text x="520" y="448">✅ Audit de la CA, CDP et AIA en LDAP seulement</text>
    <text x="520" y="468">✅ Clé de la CA sauvegardée hors de DC01</text>
  </g>
</svg>
