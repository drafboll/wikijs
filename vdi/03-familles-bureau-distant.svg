<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="470" fill="#ffffff"></rect>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">VDI, RDS ou DaaS : trois façons de livrer un bureau</text>
  <g font-size="13" text-anchor="middle">
    
    <rect x="30" y="60" width="295" height="390" rx="12" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"></rect>
    <text x="177" y="88" font-size="17" font-weight="700" fill="#5b1e8a">VDI</text>
    <text x="177" y="108" font-size="12" fill="#5b1e8a">1 utilisateur = 1 VM</text>
    <rect x="50" y="125" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="90" y="147" font-size="11">Win 11</text><text x="90" y="163" font-size="11">👤 A</text>
    <rect x="137" y="125" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="177" y="147" font-size="11">Win 11</text><text x="177" y="163" font-size="11">👤 B</text>
    <rect x="224" y="125" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="264" y="147" font-size="11">Win 11</text><text x="264" y="163" font-size="11">👤 C</text>
    <rect x="50" y="182" width="254" height="30" rx="6" fill="#e6f4ea" stroke="#188038"></rect><text x="177" y="202" font-size="12">ESXi</text>
    <g text-anchor="start" font-size="12" fill="#3c4043">
      <text x="50" y="240">✓ OS client (Windows 10/11)</text>
      <text x="50" y="260">✓ Isolation totale entre utilisateurs</text>
      <text x="50" y="280">✓ Utilisateur peut être admin, GPU</text>
      <text x="50" y="300">✗ Plus de RAM et de stockage</text>
      <text x="50" y="320">✗ Licences Windows VDA / E3-E5</text>
      <text x="50" y="350" font-weight="700" fill="#5b1e8a">Horizon : « Desktop Pool »</text>
      <text x="50" y="372" fill="#5f6368">Développeurs, graphistes,</text>
      <text x="50" y="390" fill="#5f6368">utilisateurs exigeants, applis</text>
      <text x="50" y="408" fill="#5f6368">non compatibles multi-session</text>
    </g>
    
    <rect x="342" y="60" width="295" height="390" rx="12" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect>
    <text x="489" y="88" font-size="17" font-weight="700" fill="#b06000">RDS (« TSE »)</text>
    <text x="489" y="108" font-size="12" fill="#b06000">N utilisateurs sur 1 Windows Server</text>
    <rect x="362" y="125" width="254" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="489" y="147" font-size="11">Windows Server (RDSH)</text><text x="489" y="163" font-size="11">👤A 👤B 👤C 👤D 👤E 👤F ...</text>
    <rect x="362" y="182" width="254" height="30" rx="6" fill="#e6f4ea" stroke="#188038"></rect><text x="489" y="202" font-size="12">ESXi</text>
    <g text-anchor="start" font-size="12" fill="#3c4043">
      <text x="362" y="240">✓ Très économique (densité x3 à x5)</text>
      <text x="362" y="260">✓ Une seule VM à patcher pour N users</text>
      <text x="362" y="280">✓ Idéal pour publier UNE application</text>
      <text x="362" y="300">✗ Un utilisateur gourmand gêne les autres</text>
      <text x="362" y="320">✗ Applis parfois incompatibles</text>
      <text x="362" y="350" font-weight="700" fill="#b06000">Horizon : « Farm » RDSH</text>
      <text x="362" y="372" fill="#5f6368">Bureautique, centres d'appels,</text>
      <text x="362" y="390" fill="#5f6368">applications publiées seules</text>
      <text x="362" y="408" fill="#5f6368">(ex. : un ERP sans tout le bureau)</text>
    </g>
    
    <rect x="654" y="60" width="295" height="390" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"></rect>
    <text x="801" y="88" font-size="17" font-weight="700" fill="#174ea6">DaaS</text>
    <text x="801" y="108" font-size="12" fill="#174ea6">Desktop as a Service (cloud)</text>
    <rect x="674" y="125" width="254" height="87" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-dasharray="5 4"></rect><text x="801" y="160" font-size="22">☁</text><text x="801" y="188" font-size="11">VDI ou RDS hébergés chez un fournisseur</text>
    <g text-anchor="start" font-size="12" fill="#3c4043">
      <text x="674" y="240">✓ Pas de datacenter à gérer</text>
      <text x="674" y="260">✓ Paiement à l'usage, très élastique</text>
      <text x="674" y="280">✓ Rapide à démarrer</text>
      <text x="674" y="300">✗ Coût récurrent, sortie de données</text>
      <text x="674" y="320">✗ Dépendance au fournisseur</text>
      <text x="674" y="350" font-weight="700" fill="#174ea6">Exemples</text>
      <text x="674" y="372" fill="#5f6368">Azure Virtual Desktop, Windows 365,</text>
      <text x="674" y="390" fill="#5f6368">Amazon WorkSpaces, Horizon sur</text>
      <text x="674" y="408" fill="#5f6368">Azure / AWS / Google Cloud</text>
    </g>
  </g>
</svg>
