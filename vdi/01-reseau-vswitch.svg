<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="520" fill="#ffffff"></rect>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Le réseau dans un hôte ESXi</text>
  
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="70" width="140" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="130" y="98" font-weight="700" fill="#174ea6">VM vcsa01</text><text x="130" y="118" fill="#174ea6" font-size="12">vNIC</text>
    <rect x="230" y="70" width="140" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="300" y="98" font-weight="700" fill="#174ea6">VM cs01</text><text x="300" y="118" fill="#174ea6" font-size="12">vNIC</text>
    <rect x="400" y="70" width="140" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="470" y="98" font-weight="700" fill="#174ea6">VM vdi-01</text><text x="470" y="118" fill="#174ea6" font-size="12">vNIC</text>
    <rect x="640" y="70" width="280" height="70" rx="8" fill="#e6f4ea" stroke="#188038"></rect><text x="780" y="96" font-weight="700" fill="#0d652d">VMkernel vmk0</text><text x="780" y="116" fill="#0d652d" font-size="12">l'interface de l'ESXi lui-même</text><text x="780" y="132" fill="#0d652d" font-size="12">192.168.50.11 (management)</text>
    
    <line x1="130" y1="140" x2="300" y2="200" stroke="#1a73e8" stroke-width="2"></line>
    <line x1="300" y1="140" x2="300" y2="200" stroke="#1a73e8" stroke-width="2"></line>
    <line x1="470" y1="140" x2="300" y2="200" stroke="#1a73e8" stroke-width="2"></line>
    <line x1="780" y1="140" x2="780" y2="200" stroke="#188038" stroke-width="2"></line>
    
    <rect x="40" y="185" width="900" height="130" rx="10" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect>
    <text x="490" y="300" font-weight="700" fill="#b06000" font-size="15">vSwitch0 : un switch logiciel à l'intérieur de l'ESXi</text>
    <rect x="130" y="200" width="340" height="60" rx="6" fill="#fff" stroke="#e37400"></rect><text x="300" y="225" font-weight="700" fill="#b06000">Port group « VM Network »</text><text x="300" y="245" fill="#3c4043" font-size="12">où l'on branche les cartes des VM (VLAN 0)</text>
    <rect x="610" y="200" width="340" height="60" rx="6" fill="#fff" stroke="#e37400" transform="translate(-30,0)"></rect><text x="750" y="225" font-weight="700" fill="#b06000">Port group « Management Network »</text><text x="750" y="245" fill="#3c4043" font-size="12">pour vmk0 (accès client web, vCenter)</text>
    
    <line x1="490" y1="315" x2="490" y2="365" stroke="#5f6368" stroke-width="3"></line>
    <rect x="390" y="365" width="200" height="50" rx="6" fill="#e8eaed" stroke="#5f6368" stroke-width="2"></rect><text x="490" y="388" font-weight="700" fill="#3c4043">vmnic0 (uplink)</text><text x="490" y="406" fill="#3c4043" font-size="12">carte réseau physique</text>
    <line x1="490" y1="415" x2="490" y2="450" stroke="#5f6368" stroke-width="3"></line>
    <rect x="340" y="450" width="300" height="44" rx="6" fill="#f1f3f4" stroke="#5f6368"></rect><text x="490" y="477" font-weight="700" fill="#3c4043">Switch physique / réseau de l'entreprise</text>
    <text x="490" y="512" fill="#5f6368" font-size="12">Dans ton lab : la vmnic0 de l'ESXi est branchée sur VMnet8 (NAT) de Workstation</text>
  </g>
  <g font-size="12" fill="#3c4043">
    <text x="660" y="380" font-weight="700">À retenir</text>
    <text x="660" y="398">• Standard vSwitch : configuré hôte par hôte</text>
    <text x="660" y="416">• Distributed vSwitch (vDS) : géré par vCenter,</text>
    <text x="672" y="432">identique sur tous les hôtes du cluster</text>
    <text x="40" y="380" font-weight="700">Vocabulaire</text>
    <text x="40" y="398">• vNIC : carte réseau de la VM</text>
    <text x="40" y="416">• Port group : « prise » avec une politique (VLAN...)</text>
    <text x="40" y="434">• vmk : interface réseau de l'ESXi (mgmt, vMotion...)</text>
  </g>
</svg>
