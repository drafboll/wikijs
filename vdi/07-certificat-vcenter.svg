<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="420" fill="#ffffff"></rect>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Donner au vCenter un certificat LAB-ROOT-CA (mode hybride)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="65" width="175" height="200" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
    <text x="107" y="90" font-size="14" font-weight="700" fill="#0d652d">① vCenter</text>
    <text x="107" y="114" fill="#3c4043">ajouter LAB-ROOT-CA</text>
    <text x="107" y="132" fill="#3c4043">aux certificats racines</text>
    <text x="107" y="150" fill="#3c4043">approuvés</text>
    <text x="107" y="190" fill="#5f6368">snapshot du vCenter</text>
    <text x="107" y="208" fill="#5f6368">avant de commencer</text>
    <text x="205" y="170" font-size="22" fill="#1a73e8">➜</text>

    <rect x="220" y="65" width="175" height="200" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
    <text x="307" y="90" font-size="14" font-weight="700" fill="#0d652d">② vCenter</text>
    <text x="307" y="114" fill="#3c4043">générer la CSR</text>
    <text x="307" y="132" fill="#3c4043">CN 192.168.50.12</text>
    <text x="307" y="150" fill="#3c4043">SAN : IP 192.168.50.12</text>
    <text x="307" y="168" fill="#3c4043">+ vcenter.lab.lan</text>
    <text x="307" y="208" fill="#5f6368">la clé privée reste</text>
    <text x="307" y="226" fill="#5f6368">dans le vCenter</text>
    <text x="405" y="170" font-size="22" fill="#1a73e8">➜</text>

    <rect x="420" y="65" width="175" height="200" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"></rect>
    <text x="507" y="90" font-size="14" font-weight="700" fill="#a50e0e">③ DC01</text>
    <text x="507" y="114" fill="#3c4043">certreq -submit</text>
    <text x="507" y="132" fill="#3c4043">modèle</text>
    <text x="507" y="150" fill="#3c4043">LAB-vCenterServer</text>
    <text x="507" y="190" font-weight="700" fill="#a50e0e">➜ demande</text>
    <text x="507" y="208" font-weight="700" fill="#a50e0e">« en attente »</text>
    <text x="605" y="170" font-size="22" fill="#1a73e8">➜</text>

    <rect x="620" y="65" width="175" height="200" rx="10" fill="#fef7e0" stroke="#e37400" stroke-width="3"></rect>
    <text x="707" y="90" font-size="14" font-weight="700" fill="#b06000">④ Toi, dans certsrv</text>
    <text x="707" y="114" fill="#3c4043">vérifier le nom et</text>
    <text x="707" y="132" fill="#3c4043">les noms alternatifs</text>
    <text x="707" y="150" fill="#3c4043">puis « Délivrer »</text>
    <text x="707" y="190" font-weight="700" fill="#b06000">🔒 l'approbation</text>
    <text x="707" y="208" font-weight="700" fill="#b06000">bloque ESC1</text>
    <text x="805" y="170" font-size="22" fill="#1a73e8">➜</text>

    <rect x="820" y="65" width="160" height="200" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
    <text x="900" y="90" font-size="14" font-weight="700" fill="#0d652d">⑤ vCenter</text>
    <text x="900" y="114" fill="#3c4043">importer et</text>
    <text x="900" y="132" fill="#3c4043">remplacer :</text>
    <text x="900" y="150" fill="#3c4043">certificat + chaîne</text>
    <text x="900" y="190" fill="#5f6368">les services</text>
    <text x="900" y="208" fill="#5f6368">redémarrent</text>
    <text x="900" y="226" fill="#5f6368">(10 à 15 min)</text>
  </g>

  <rect x="20" y="290" width="470" height="110" rx="10" fill="#e8f0fe" stroke="#1a73e8"></rect>
  <text x="40" y="315" font-size="14" font-weight="700" fill="#174ea6">Mode hybride : ce qui change</text>
  <g font-size="12" fill="#3c4043">
    <text x="40" y="338">• Seul le certificat SSL de la machine (le site web) vient de LAB-ROOT-CA</text>
    <text x="40" y="358">• La VMCA continue de signer les certificats des ESXi</text>
    <text x="40" y="378">• Pas de VMCA subordonnée : le vCenter n'émet rien pour le domaine</text>
  </g>
  <rect x="510" y="290" width="470" height="110" rx="10" fill="#e6f4ea" stroke="#188038"></rect>
  <text x="530" y="315" font-size="14" font-weight="700" fill="#0d652d">Résultat</text>
  <g font-size="12" fill="#3c4043">
    <text x="530" y="338">✅ https://192.168.50.12/ui sans alerte (machines du domaine)</text>
    <text x="530" y="358">✅ Horizon ajoute le vCenter sans « certificat non valide »</text>
    <text x="530" y="378">🔁 Renouvellement chaque année, comme DC01 et Horizon</text>
  </g>
</svg>
