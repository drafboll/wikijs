<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"></rect>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Architecture du lab VDI · domaine SRV-GRP3.lan</text>
  
  <rect x="410" y="52" width="180" height="40" rx="20" fill="#f1f3f4" stroke="#5f6368"></rect><text x="500" y="77" text-anchor="middle" font-size="14" fill="#3c4043">☁ Internet</text>
  <line x1="500" y1="92" x2="500" y2="118" stroke="#5f6368" stroke-width="2"></line>
  
  <rect x="330" y="118" width="340" height="44" rx="8" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect>
  <text x="500" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#b06000">Passerelle NAT VMware · 192.168.50.2</text>
  <text x="500" y="155" text-anchor="middle" font-size="12" fill="#b06000">VMnet8 · 192.168.50.0/24</text>
  <line x1="500" y1="162" x2="500" y2="190" stroke="#e37400" stroke-width="3"></line>
  
  <line x1="80" y1="190" x2="920" y2="190" stroke="#e37400" stroke-width="5"></line>
  <text x="900" y="182" text-anchor="end" font-size="12" fill="#b06000" font-weight="700">réseau VMnet8</text>
  
  <line x1="150" y1="190" x2="150" y2="220" stroke="#e37400" stroke-width="3"></line>
  <rect x="40" y="220" width="220" height="120" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"></rect>
  <text x="150" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#3c4043">💻 Hôte Windows 11</text>
  <text x="150" y="265" text-anchor="middle" font-size="12" fill="#3c4043">192.168.50.1 (carte VMnet8)</text>
  <text x="150" y="288" text-anchor="middle" font-size="12" fill="#3c4043">Client Horizon</text>
  <text x="150" y="306" text-anchor="middle" font-size="12" fill="#3c4043">Navigateur : vSphere Client,</text>
  <text x="150" y="322" text-anchor="middle" font-size="12" fill="#3c4043">console Horizon</text>
  
  <line x1="150" y1="340" x2="150" y2="360" stroke="#9aa0a6" stroke-width="2" stroke-dasharray="4 3"></line>
  <line x1="380" y1="190" x2="380" y2="220" stroke="#e37400" stroke-width="3"></line>
  <rect x="280" y="220" width="200" height="120" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"></rect>
  <text x="380" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#a50e0e">🛡 SRV-GRP3</text>
  <text x="380" y="265" text-anchor="middle" font-size="12" fill="#a50e0e">VM Workstation · 4 Go</text>
  <text x="380" y="285" text-anchor="middle" font-size="12" fill="#a50e0e">AD DS · DNS · NTP · DHCP</text>
  <text x="380" y="305" text-anchor="middle" font-size="12" fill="#a50e0e">Contrôleur de domaine</text>
  <text x="380" y="327" text-anchor="middle" font-size="13" font-weight="700" fill="#a50e0e">192.168.50.10</text>
  
  <line x1="720" y1="190" x2="720" y2="220" stroke="#e37400" stroke-width="3"></line>
  <rect x="500" y="220" width="460" height="355" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
  <text x="520" y="245" font-size="15" font-weight="700" fill="#0d652d">🖥 esx01 · ESXi 8 imbriqué · 192.168.50.11</text>
  <text x="520" y="263" font-size="12" fill="#0d652d">8 vCPU · 48 Go RAM · boot 32 Go · datastore ds-esx01 300 Go</text>
  <text x="520" y="281" font-size="12" fill="#0d652d">vCenter : DC-LAB ▸ CL-LAB (DRS/HA off)</text>
  <g font-size="12" text-anchor="middle">
    <rect x="520" y="295" width="205" height="80" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect>
    <text x="622" y="317" font-size="13" font-weight="700" fill="#5b1e8a">vcsa01</text>
    <text x="622" y="335" fill="#5b1e8a">vCenter Server (Tiny)</text>
    <text x="622" y="351" fill="#5b1e8a">2 vCPU · 12-14 Go</text>
    <text x="622" y="367" font-weight="700" fill="#5b1e8a">192.168.50.12</text>
    <rect x="735" y="295" width="205" height="80" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect>
    <text x="837" y="317" font-size="13" font-weight="700" fill="#5b1e8a">cs01 (VM « Horizon »)</text>
    <text x="837" y="335" fill="#5b1e8a">Connection Server</text>
    <text x="837" y="351" fill="#5b1e8a">4 vCPU · 8 Go · 80 Go</text>
    <text x="837" y="367" font-weight="700" fill="#5b1e8a">192.168.50.13</text>
    <rect x="520" y="385" width="420" height="70" rx="8" fill="#e8f0fe" stroke="#1a73e8"></rect>
    <text x="730" y="407" font-size="13" font-weight="700" fill="#174ea6">Golden Image (éteinte, snapshot gold-v1)</text>
    <text x="730" y="425" fill="#174ea6">Windows 10/11 · VMware Tools · Horizon Agent · 2 vCPU · 4 Go · 60 Go</text>
    <text x="730" y="443" fill="#174ea6">IP : DHCP (ou .20 pendant la préparation)</text>
    <rect x="520" y="465" width="205" height="95" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-dasharray="5 4"></rect>
    <text x="622" y="490" font-size="13" font-weight="700" fill="#174ea6">vdi-01</text>
    <text x="622" y="508" fill="#174ea6">Instant Clone</text>
    <text x="622" y="526" fill="#174ea6">2 vCPU · 4 Go</text>
    <text x="622" y="544" fill="#174ea6">IP DHCP .100-.199</text>
    <rect x="735" y="465" width="205" height="95" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-dasharray="5 4"></rect>
    <text x="837" y="490" font-size="13" font-weight="700" fill="#174ea6">vdi-02</text>
    <text x="837" y="508" fill="#174ea6">Instant Clone</text>
    <text x="837" y="526" fill="#174ea6">2 vCPU · 4 Go</text>
    <text x="837" y="544" fill="#174ea6">IP DHCP .100-.199</text>
  </g>
  
  <g font-size="12" fill="#3c4043">
    <text x="40" y="380" font-weight="700" font-size="13">Noms DNS (zone SRV-GRP3.lan)</text>
    <text x="40" y="402" font-family="Consolas, monospace">srv-grp3.SRV-GRP3.lan  .10</text>
    <text x="40" y="420" font-family="Consolas, monospace">esx01.SRV-GRP3.lan     .11</text>
    <text x="40" y="438" font-family="Consolas, monospace">vcsa01.SRV-GRP3.lan    .12</text>
    <text x="40" y="456" font-family="Consolas, monospace">cs01.SRV-GRP3.lan      .13</text>
    <text x="40" y="490" font-weight="700" font-size="13">Budget RAM (80 Go)</text>
    <text x="40" y="510">Windows hôte ~16 · SRV-GRP3 4 · esx01 48</text>
    <text x="40" y="528">dans esx01 : vcsa 12-14 · cs01 8 · GI 4 · 2 VDI 8</text>
    <text x="40" y="546">➜ on éteint la golden image une fois prête</text>
  </g>
</svg>
