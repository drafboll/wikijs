<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="560" fill="#ffffff"></rect>
  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Les poupées russes de ton lab (virtualisation imbriquée)</text>
  
  <rect x="20" y="55" width="940" height="490" rx="14" fill="#e8eaed" stroke="#5f6368" stroke-width="2"></rect>
  <text x="40" y="82" font-size="15" font-weight="700" fill="#3c4043">Niveau 0 : ton PC physique</text>
  <text x="300" y="82" font-size="12" fill="#3c4043">Ryzen 5 5500 (6c/12t, AMD-V activé dans le BIOS) · 80 Go RAM · Windows 11</text>
  
  <rect x="40" y="95" width="900" height="435" rx="12" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect>
  <text x="60" y="120" font-size="15" font-weight="700" fill="#b06000">Niveau 1 : VMware Workstation Pro (type 2)</text>
  <text x="430" y="120" font-size="12" fill="#b06000">réseau NAT VMnet8 : 192.168.50.0/24, passerelle .2</text>
  <rect x="60" y="135" width="200" height="110" rx="8" fill="#fce8e6" stroke="#d93025"></rect>
  <text x="160" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#a50e0e">VM SRV-GRP3</text>
  <text x="160" y="182" text-anchor="middle" font-size="12" fill="#a50e0e">Windows Server</text>
  <text x="160" y="200" text-anchor="middle" font-size="12" fill="#a50e0e">AD DS · DNS · NTP</text>
  <text x="160" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#a50e0e">192.168.50.10</text>
  <rect x="60" y="260" width="200" height="110" rx="8" fill="#ffffff" stroke="#5f6368" stroke-dasharray="5 4"></rect>
  <text x="160" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4043">Hôte Windows</text>
  <text x="160" y="310" text-anchor="middle" font-size="12" fill="#3c4043">Client Horizon</text>
  <text x="160" y="328" text-anchor="middle" font-size="12" fill="#3c4043">navigateur (vCenter, console)</text>
  <text x="160" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#3c4043">192.168.50.1</text>
  
  <rect x="280" y="135" width="640" height="380" rx="12" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
  <text x="300" y="160" font-size="15" font-weight="700" fill="#0d652d">Niveau 2 : VM esx01 = ESXi 8 imbriqué (type 1)</text>
  <text x="300" y="180" font-size="12" fill="#0d652d">8 vCPU · 48 Go · option « Virtualize AMD-V/RVI » cochée · 192.168.50.11</text>
  
  <text x="300" y="208" font-size="15" font-weight="700" fill="#1a73e8">Niveau 3 : les VM qui tournent DANS l'ESXi</text>
  <g font-size="13" text-anchor="middle">
    <rect x="300" y="222" width="190" height="90" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect><text x="395" y="247" font-weight="700" fill="#5b1e8a">vcsa01</text><text x="395" y="267" font-size="12" fill="#5b1e8a">vCenter (Tiny)</text><text x="395" y="290" font-size="12" fill="#5b1e8a">192.168.50.12</text>
    <rect x="505" y="222" width="190" height="90" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect><text x="600" y="247" font-weight="700" fill="#5b1e8a">Horizon (cs01)</text><text x="600" y="267" font-size="12" fill="#5b1e8a">Connection Server</text><text x="600" y="290" font-size="12" fill="#5b1e8a">192.168.50.13</text>
    <rect x="710" y="222" width="190" height="90" rx="8" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="805" y="247" font-weight="700" fill="#174ea6">Golden Image</text><text x="805" y="267" font-size="12" fill="#174ea6">Windows + Agent</text><text x="805" y="290" font-size="12" fill="#174ea6">modèle des bureaux</text>
    <rect x="300" y="327" width="600" height="90" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-dasharray="6 4"></rect>
    <text x="600" y="352" font-weight="700" fill="#174ea6">vdi-01 · vdi-02 ... (Instant Clones créés par Horizon)</text>
    <text x="600" y="374" font-size="12" fill="#174ea6">2 vCPU · 4 Go chacun · adresse IP par DHCP</text>
    <text x="600" y="396" font-size="12" fill="#174ea6">c'est sur ces machines que l'utilisateur travaille</text>
    <rect x="300" y="430" width="600" height="70" rx="8" fill="#fef7e0" stroke="#e37400"></rect>
    <text x="600" y="455" font-weight="700" fill="#b06000">Datastore ds-esx01 (VMFS-6, 300 Go)</text>
    <text x="600" y="477" font-size="12" fill="#b06000">en réalité : un simple fichier .vmdk sur le disque de ton PC</text>
  </g>
</svg>
