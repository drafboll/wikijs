<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8430ce"></path></marker></defs>
  <rect width="980" height="520" fill="#ffffff"></rect>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">vCenter : le chef d'orchestre et son inventaire</text>
  
  <rect x="340" y="56" width="300" height="56" rx="10" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"></rect>
  <text x="490" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#5b1e8a">vCenter Server (vcsa01)</text>
  <text x="490" y="100" text-anchor="middle" font-size="12" fill="#5b1e8a">pilote tous les ESXi depuis une seule console</text>
  <line x1="490" y1="112" x2="490" y2="140" stroke="#8430ce" stroke-width="2" marker-end="url(#a)"></line>
  
  <rect x="40" y="145" width="900" height="300" rx="12" fill="#fafafa" stroke="#5f6368" stroke-width="2" stroke-dasharray="8 4"></rect>
  <text x="60" y="170" font-size="15" font-weight="700" fill="#3c4043">🏢 Datacenter « DC-LAB »</text>
  <text x="270" y="170" font-size="12" fill="#5f6368">conteneur logique (souvent = un site physique)</text>
  
  <rect x="60" y="185" width="600" height="245" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
  <text x="80" y="210" font-size="15" font-weight="700" fill="#0d652d">🗂 Cluster « CL-LAB »</text>
  <text x="260" y="210" font-size="12" fill="#0d652d">groupe d'hôtes qui partagent leurs ressources (HA, DRS)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="80" y="225" width="270" height="190" rx="8" fill="#fff" stroke="#188038"></rect>
    <text x="215" y="248" font-weight="700" fill="#0d652d">🖥 Hôte esx01 (192.168.50.11)</text>
    <rect x="95" y="260" width="115" height="34" rx="5" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="152" y="282" fill="#174ea6" font-size="12">vcsa01</text>
    <rect x="220" y="260" width="115" height="34" rx="5" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="277" y="282" fill="#174ea6" font-size="12">Horizon (cs01)</text>
    <rect x="95" y="302" width="115" height="34" rx="5" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="152" y="324" fill="#174ea6" font-size="12">Golden Image</text>
    <rect x="220" y="302" width="115" height="34" rx="5" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="277" y="324" fill="#174ea6" font-size="12">vdi-01, vdi-02</text>
    <rect x="95" y="350" width="240" height="50" rx="5" fill="#fef7e0" stroke="#e37400"></rect><text x="215" y="371" fill="#b06000" font-size="12" font-weight="700">💾 Datastore ds-esx01</text><text x="215" y="389" fill="#b06000" font-size="12">VMFS-6 · 299,75 Go</text>
    <rect x="370" y="225" width="270" height="190" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-dasharray="6 4"></rect>
    <text x="505" y="300" fill="#9aa0a6" font-weight="700">🖥 Hôte esx02</text>
    <text x="505" y="322" fill="#9aa0a6" font-size="12">(en production : plusieurs hôtes,</text>
    <text x="505" y="340" fill="#9aa0a6" font-size="12">stockage partagé SAN / NAS / vSAN)</text>
  </g>
  
  <g font-size="12" fill="#3c4043">
    <rect x="680" y="185" width="240" height="245" rx="10" fill="#fff" stroke="#9aa0a6"></rect>
    <text x="700" y="210" font-size="14" font-weight="700">Autres objets d'inventaire</text>
    <text x="700" y="238">📁 Dossiers de VM (VM folders)</text>
    <text x="712" y="254" fill="#5f6368">ranger : Infra, Golden, VDI...</text>
    <text x="700" y="282">🥧 Resource pools</text>
    <text x="712" y="298" fill="#5f6368">réserver/limiter CPU et RAM</text>
    <text x="700" y="326">🌐 Réseaux / port groups</text>
    <text x="712" y="342" fill="#5f6368">VM Network, vDS...</text>
    <text x="700" y="370">📄 Templates et bibliothèques</text>
    <text x="712" y="386" fill="#5f6368">modèles de VM, ISO</text>
    <text x="700" y="414">🔐 Rôles et permissions</text>
  </g>
  <rect x="40" y="460" width="900" height="44" rx="8" fill="#f3e8fd" stroke="#8430ce"></rect>
  <text x="490" y="487" text-anchor="middle" font-size="13" fill="#5b1e8a">Horizon ne parle pas directement aux ESXi : il demande à vCenter de cloner, allumer, éteindre et supprimer les bureaux.</text>
</svg>
