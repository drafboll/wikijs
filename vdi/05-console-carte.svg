<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"></rect>
  <text x="500" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">La carte de la Horizon Console</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#5f6368">https://horizon.lab.lan/admin · menu de gauche</text>
  <g font-size="12">
    
    <rect x="20" y="75" width="230" height="300" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"></rect>
    <text x="135" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#174ea6">📊 Monitor</text>
    <text x="135" y="120" text-anchor="middle" fill="#174ea6">« que se passe-t-il ? »</text>
    <g fill="#3c4043">
      <text x="35" y="148" font-weight="700">Dashboard</text><text x="35" y="164">santé des composants, sessions</text>
      <text x="35" y="192" font-weight="700">Sessions</text><text x="35" y="208">qui est connecté, où, depuis quand</text>
      <text x="35" y="236" font-weight="700">Problem Machines</text><text x="35" y="252">machines en erreur</text>
      <text x="35" y="280" font-weight="700">Events</text><text x="35" y="296">journal (connexions, erreurs)</text>
      <text x="35" y="324" font-weight="700">System Health</text><text x="35" y="340">CS, vCenter, AD, base Events</text>
      <text x="35" y="362" fill="#5f6368">(+ recherche Helpdesk d'un utilisateur)</text>
    </g>
    
    <rect x="265" y="75" width="230" height="300" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect>
    <text x="380" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#0d652d">🗂 Inventory</text>
    <text x="380" y="120" text-anchor="middle" fill="#0d652d">« qu'est-ce que je propose ? »</text>
    <g fill="#3c4043">
      <text x="280" y="148" font-weight="700">Desktops</text><text x="280" y="164">les desktop pools (VDI et RDS)</text>
      <text x="280" y="192" font-weight="700">Applications</text><text x="280" y="208">les application pools publiés</text>
      <text x="280" y="236" font-weight="700">Farms</text><text x="280" y="252">les groupes de serveurs RDSH</text>
      <text x="280" y="280" font-weight="700">Machines</text><text x="280" y="296">toutes les VM / serveurs avec agent</text>
      <text x="280" y="324" font-weight="700">Global Entitlements</text><text x="280" y="340">droits multi-pods (CPA)</text>
    </g>
    
    <rect x="510" y="75" width="230" height="300" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"></rect>
    <text x="625" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#a50e0e">👥 Users and Groups</text>
    <text x="625" y="120" text-anchor="middle" fill="#a50e0e">« qui a droit à quoi ? »</text>
    <g fill="#3c4043">
      <text x="525" y="148" font-weight="700">Entitlements</text><text x="525" y="164">droits par utilisateur / groupe</text>
      <text x="525" y="192" font-weight="700">Recherche d'utilisateur</text><text x="525" y="208">ses pools, sessions, machines</text>
      <text x="525" y="236" font-weight="700">Home site (CPA)</text><text x="525" y="252">site préféré d'un utilisateur</text>
      <text x="525" y="296" fill="#5f6368">Astuce : la plupart des droits</text>
      <text x="525" y="312" fill="#5f6368">se posent depuis le pool lui-même</text>
      <text x="525" y="328" fill="#5f6368">(onglet Entitlements)</text>
    </g>
    
    <rect x="755" y="75" width="225" height="505" rx="10" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"></rect>
    <text x="867" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#5b1e8a">⚙ Settings</text>
    <text x="867" y="120" text-anchor="middle" fill="#5b1e8a">« comment c'est configuré ? »</text>
    <g fill="#3c4043">
      <text x="770" y="148" font-weight="700">Servers</text><text x="770" y="163">vCenter, Connection Servers, UAG</text>
      <text x="770" y="188" font-weight="700">Domains</text><text x="770" y="203">domaines AD vus par Horizon</text>
      <text x="770" y="228" font-weight="700">Product Licensing and Usage</text><text x="770" y="243">licence, compteurs d'usage</text>
      <text x="770" y="268" font-weight="700">Global Settings</text><text x="770" y="283">timeouts, sécurité, messages</text>
      <text x="770" y="308" font-weight="700">Registered Machines</text><text x="770" y="323">serveurs RDS / machines manuelles</text>
      <text x="770" y="348" font-weight="700">Administrators</text><text x="770" y="363">rôles, permissions, access groups</text>
      <text x="770" y="388" font-weight="700">Cloud Pod Architecture</text><text x="770" y="403">fédération multi-pods</text>
      <text x="770" y="428" font-weight="700">Sites</text>
      <text x="770" y="453" font-weight="700">Event Configuration</text><text x="770" y="468">base Events, syslog</text>
      <text x="770" y="493" font-weight="700">Global Policies</text><text x="770" y="508">USB, multimédia, accès distant</text>
      <text x="770" y="533" font-weight="700">Instant Clone Domain Accounts</text>
      <text x="770" y="558" font-weight="700">Helpdesk / SAML / RADIUS...</text>
    </g>
  </g>
  
  <rect x="20" y="395" width="720" height="185" rx="10" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect>
  <text x="40" y="422" font-size="15" font-weight="700" fill="#b06000">Ta routine du matin d'admin VDI (5 minutes)</text>
  <g font-size="13" fill="#3c4043">
    <text x="40" y="450">1. Monitor ➜ Dashboard : tout est vert ? (Connection Servers, vCenter, AD, base Events, UAG)</text>
    <text x="40" y="474">2. Monitor ➜ Problem Machines : des bureaux en erreur ? Les remettre en service ou les supprimer.</text>
    <text x="40" y="498">3. Inventory ➜ Desktops : chaque pool a-t-il assez de machines « Available » pour la journée ?</text>
    <text x="40" y="522">4. Monitor ➜ Events : erreurs depuis hier (provisioning, échecs de connexion) ?</text>
    <text x="40" y="546">5. vCenter : espace libre des datastores, alarmes CPU / RAM des hôtes.</text>
    <text x="40" y="570">6. Licences : nombre de sessions simultanées par rapport à la licence achetée.</text>
  </g>
</svg>
