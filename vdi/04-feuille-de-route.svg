  <line x1="60" y1="290" x2="940" y2="290" stroke="#dadce0" stroke-width="6" stroke-linecap="round"></line>
  <g font-size="12" text-anchor="middle">
    
    <circle cx="100" cy="120" r="26" fill="#d93025"></circle><text x="100" y="126" fill="#fff" font-size="16" font-weight="700">0</text>
    <text x="100" y="166" font-weight="700" fill="#a50e0e">Prérequis</text><text x="100" y="184" fill="#3c4043">DNS, comptes,</text><text x="100" y="200" fill="#3c4043">compatibilité</text>
    <circle cx="300" cy="120" r="26" fill="#5f6368"></circle><text x="300" y="126" fill="#fff" font-size="16" font-weight="700">1</text>
    <text x="300" y="166" font-weight="700" fill="#3c4043">Transfert</text><text x="300" y="184" fill="#3c4043">des installeurs</text><text x="300" y="200" fill="#3c4043">(partage ou ISO)</text>
    <circle cx="500" cy="120" r="26" fill="#8430ce"></circle><text x="500" y="126" fill="#fff" font-size="16" font-weight="700">2</text>
    <text x="500" y="166" font-weight="700" fill="#5b1e8a">Préparer cs01</text><text x="500" y="184" fill="#3c4043">Windows Server,</text><text x="500" y="200" fill="#3c4043">IP fixe, domaine</text>
