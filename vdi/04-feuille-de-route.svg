    <circle cx="260" cy="290" r="26" fill="#1a73e8"></circle><text x="260" y="296" fill="#fff" font-size="16" font-weight="700">6</text>
    <text x="260" y="336" font-weight="700" fill="#174ea6">Horizon Agent</text><text x="260" y="354" fill="#3c4043">option</text><text x="260" y="370" fill="#3c4043">Instant Clone</text>
    <circle cx="420" cy="290" r="26" fill="#1a73e8"></circle><text x="420" y="296" fill="#fff" font-size="16" font-weight="700">7</text>
    <text x="420" y="336" font-weight="700" fill="#174ea6">Optimiser</text><text x="420" y="354" fill="#3c4043">arrêt propre</text><text x="420" y="370" fill="#3c4043">snapshot gold-v1</text>
