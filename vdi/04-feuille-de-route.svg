    <text x="700" y="166" font-weight="700" fill="#5b1e8a">Connection Server</text><text x="700" y="184" fill="#3c4043">Standard Server</text><text x="700" y="200" fill="#3c4043">+ HTML Access</text>
    <circle cx="900" cy="120" r="26" fill="#8430ce"></circle><text x="900" y="126" fill="#fff" font-size="16" font-weight="700">4</text>
    <text x="900" y="166" font-weight="700" fill="#5b1e8a">Console</text><text x="900" y="184" fill="#3c4043">licence, vCenter,</text><text x="900" y="200" fill="#3c4043">compte domaine IC</text>
    
    <circle cx="100" cy="290" r="26" fill="#1a73e8"></circle><text x="100" y="296" fill="#fff" font-size="16" font-weight="700">5</text>
