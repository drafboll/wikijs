<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="470" fill="#ffffff"></rect>
  <text x="490" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Les deux types d'hyperviseurs</text>
  <g font-size="14" text-anchor="middle">
    
    <text x="240" y="74" font-size="17" font-weight="700" fill="#188038">Type 1 : « bare-metal »</text>
    <text x="240" y="94" font-size="13" fill="#5f6368">installé directement sur le matériel</text>
    <rect x="50" y="110" width="120" height="60" rx="6" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="110" y="137" fill="#174ea6" font-weight="700">VM</text><text x="110" y="157" font-size="12" fill="#174ea6">Windows</text>
    <rect x="180" y="110" width="120" height="60" rx="6" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="240" y="137" fill="#174ea6" font-weight="700">VM</text><text x="240" y="157" font-size="12" fill="#174ea6">Linux</text>
    <rect x="310" y="110" width="120" height="60" rx="6" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="370" y="137" fill="#174ea6" font-weight="700">VM</text><text x="370" y="157" font-size="12" fill="#174ea6">vCenter</text>
    <rect x="50" y="185" width="380" height="60" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="2"></rect><text x="240" y="212" fill="#0d652d" font-weight="700">Hyperviseur type 1</text><text x="240" y="232" font-size="12" fill="#0d652d">VMware ESXi · Microsoft Hyper-V · Proxmox VE · Nutanix AHV</text>
    <rect x="50" y="260" width="380" height="55" rx="6" fill="#e8eaed" stroke="#5f6368" stroke-width="2"></rect><text x="240" y="293" fill="#3c4043" font-weight="700">Matériel (serveur physique)</text>
    <g font-size="13" text-anchor="start" fill="#3c4043">
      <text x="50" y="345">✓ Performances maximales (pas d'OS intermédiaire)</text>
      <text x="50" y="367">✓ Très stable, très sécurisé, fait pour la production</text>
      <text x="50" y="389">✓ Utilisé en datacenter et pour la VDI</text>
      <text x="50" y="411">✗ La machine ne sert plus qu'à ça (pas de bureau)</text>
    </g>
    
    <line x1="490" y1="65" x2="490" y2="440" stroke="#dadce0" stroke-width="2" stroke-dasharray="6 6"></line>
    
    <text x="740" y="74" font-size="17" font-weight="700" fill="#e37400">Type 2 : « hébergé »</text>
    <text x="740" y="94" font-size="13" fill="#5f6368">logiciel qui tourne dans un OS classique</text>
    <rect x="550" y="110" width="120" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="610" y="140" fill="#174ea6" font-weight="700">VM</text>
    <rect x="680" y="110" width="120" height="50" rx="6" fill="#e8f0fe" stroke="#1a73e8"></rect><text x="740" y="140" fill="#174ea6" font-weight="700">VM</text>
    <rect x="810" y="110" width="120" height="50" rx="6" fill="#fef7e0" stroke="#e37400"></rect><text x="870" y="133" fill="#b06000" font-size="12">Navigateur,</text><text x="870" y="150" fill="#b06000" font-size="12">Office...</text>
    <rect x="550" y="170" width="250" height="45" rx="6" fill="#fef7e0" stroke="#e37400" stroke-width="2"></rect><text x="675" y="191" fill="#b06000" font-weight="700">Hyperviseur type 2</text><text x="675" y="208" font-size="12" fill="#b06000">VMware Workstation · VirtualBox</text>
    <rect x="550" y="225" width="380" height="35" rx="6" fill="#f1f3f4" stroke="#5f6368"></rect><text x="740" y="248" fill="#3c4043" font-weight="700">Système d'exploitation hôte (Windows 11)</text>
    <rect x="550" y="270" width="380" height="45" rx="6" fill="#e8eaed" stroke="#5f6368" stroke-width="2"></rect><text x="740" y="298" fill="#3c4043" font-weight="700">Matériel (ton PC)</text>
    <g font-size="13" text-anchor="start" fill="#3c4043">
      <text x="550" y="345">✓ Simple : s'installe comme un logiciel</text>
      <text x="550" y="367">✓ Parfait pour les labs et les tests</text>
      <text x="550" y="389">✗ Moins performant (on passe par Windows)</text>
      <text x="550" y="411">✗ Non adapté à la production</text>
    </g>
  </g>
  <rect x="50" y="425" width="880" height="34" rx="6" fill="#f3e8fd" stroke="#8430ce"></rect>
  <text x="490" y="447" text-anchor="middle" font-size="13" fill="#5b1e8a">Ton lab : Workstation (type 2) sur Windows 11, qui fait tourner ESXi (type 1) dans une VM ➜ c'est de la virtualisation imbriquée (nested)</text>
</svg>
