<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d93025"></path></marker></defs>
  <rect width="1000" height="500" fill="#ffffff"></rect>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Les comptes du lab : un compte par tier, un compte par usage</text>

  <g font-size="12">
    <rect x="30" y="60" width="830" height="85" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="2"></rect>
    <text x="50" y="88" font-size="16" font-weight="700" fill="#a50e0e">Tier 0 · le domaine</text>
    <text x="50" y="110" fill="#a50e0e">Ce qui contrôle tout : DC01 (AD, DNS, DHCP), LAB-ROOT-CA</text>
    <text x="50" y="130" fill="#a50e0e">Se connecte uniquement sur DC01</text>
    <rect x="560" y="75" width="285" height="55" rx="8" fill="#ffffff" stroke="#d93025"></rect>
    <text x="702" y="98" text-anchor="middle" font-weight="700" font-family="Consolas, monospace" fill="#a50e0e">adm-dom-afaye</text>
    <text x="702" y="118" text-anchor="middle" fill="#3c4043">➜ Admins du domaine</text>

    <rect x="30" y="160" width="830" height="85" rx="10" fill="#f3e8fd" stroke="#8430ce" stroke-width="2"></rect>
    <text x="50" y="188" font-size="16" font-weight="700" fill="#5b1e8a">Tier 1 · serveurs et applications</text>
    <text x="50" y="210" fill="#5b1e8a">vCenter, ESXi (par le vCenter), serveur Horizon</text>
    <text x="50" y="230" fill="#5b1e8a">Droits donnés aux groupes, jamais aux comptes</text>
    <rect x="420" y="175" width="210" height="55" rx="8" fill="#ffffff" stroke="#8430ce"></rect>
    <text x="525" y="198" text-anchor="middle" font-weight="700" font-family="Consolas, monospace" fill="#5b1e8a">adm-vmw-afaye</text>
    <text x="525" y="218" text-anchor="middle" fill="#3c4043">➜ GG-VMW-Admins</text>
    <rect x="640" y="175" width="205" height="55" rx="8" fill="#ffffff" stroke="#8430ce"></rect>
    <text x="742" y="198" text-anchor="middle" font-weight="700" font-family="Consolas, monospace" fill="#5b1e8a">adm-hzn-afaye</text>
    <text x="742" y="218" text-anchor="middle" fill="#3c4043">➜ GG-HZN-Admins</text>

    <rect x="30" y="260" width="830" height="85" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"></rect>
    <text x="50" y="288" font-size="16" font-weight="700" fill="#174ea6">Tier 2 · postes et utilisateurs</text>
    <text x="50" y="310" fill="#174ea6">Les bureaux virtuels, l'usage de tous les jours</text>
    <text x="50" y="330" fill="#174ea6">Aucun privilège</text>
    <rect x="460" y="275" width="385" height="55" rx="8" fill="#ffffff" stroke="#1a73e8"></rect>
    <text x="652" y="298" text-anchor="middle" font-weight="700" font-family="Consolas, monospace" fill="#174ea6">afaye · user-test01 · user-test02</text>
    <text x="652" y="318" text-anchor="middle" fill="#3c4043">➜ GG-HZN-Users (droit sur le pool)</text>

    <line x1="895" y1="80" x2="895" y2="330" stroke="#d93025" stroke-width="3" marker-end="url(#a)"></line>
    <g text-anchor="middle" fill="#a50e0e" font-size="11">
      <text x="950" y="150" font-weight="700">un compte</text>
      <text x="950" y="166" font-weight="700">ne descend</text>
      <text x="950" y="182" font-weight="700">jamais</text>
      <text x="950" y="198">vers un tier</text>
      <text x="950" y="214">inférieur</text>
    </g>

    <rect x="30" y="365" width="940" height="115" rx="10" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"></rect>
    <text x="50" y="392" font-size="16" font-weight="700" fill="#3c4043">Comptes de service · un par usage, mot de passe sans expiration, aucun groupe d'administration</text>
    <rect x="50" y="405" width="290" height="60" rx="8" fill="#ffffff" stroke="#5f6368"></rect>
    <text x="195" y="428" text-anchor="middle" font-weight="700" font-family="Consolas, monospace" fill="#3c4043">svc-vcenter-ldap</text>
    <text x="195" y="448" text-anchor="middle" fill="#3c4043">vCenter lit l'AD en LDAPS · aucun droit</text>
    <rect x="355" y="405" width="290" height="60" rx="8" fill="#ffffff" stroke="#5f6368"></rect>
    <text x="500" y="428" text-anchor="middle" font-weight="700" font-family="Consolas, monospace" fill="#3c4043">svc-horizon-vc</text>
    <text x="500" y="448" text-anchor="middle" fill="#3c4043">Horizon ➜ vCenter · rôle Horizon-InstantClone</text>
    <rect x="660" y="405" width="290" height="60" rx="8" fill="#ffffff" stroke="#5f6368"></rect>
    <text x="805" y="428" text-anchor="middle" font-weight="700" font-family="Consolas, monospace" fill="#3c4043">svc-horizon-ic</text>
    <text x="805" y="448" text-anchor="middle" fill="#3c4043">jonction des clones · délégation OU=Postes</text>
  </g>
</svg>
